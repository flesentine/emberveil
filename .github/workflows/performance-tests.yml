name: Performance correctness

on:
  push:
    branches:
      - agent/performance-profiling
    paths:
      - 'docs/PERFORMANCE_PROFILING.md'
      - 'docs/performance/**'
      - 'performance-reference/**'
      - '.github/workflows/performance-tests.yml'
  pull_request:
    paths:
      - 'docs/PERFORMANCE_PROFILING.md'
      - 'docs/performance/**'
      - 'performance-reference/**'
      - '.github/workflows/performance-tests.yml'

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify optimization invariants
        run: node performance-reference/tools/test-performance-optimizations.mjs
      - name: Verify measurement records
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('docs/performance/baseline-2026-07-30.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('docs/performance/after-2026-07-30.json', 'utf8'));
          for (const key of ['pathfinding400', 'entityStreaming3000x900', 'collisionQueries12000x1400']) {
            if (!(after.benchmarks[key].medianMs < before.benchmarks[key].medianMs)) {
              throw new Error(`${key} did not improve`);
            }
          }
          console.log('Recorded performance measurements show improvements in all optimized workloads.');
          NODE
