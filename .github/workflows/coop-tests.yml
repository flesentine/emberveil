name: Co-op test room
on:
  push:
    branches: [main, agent/two-player-coop-test-room]
    paths: ['coop-test-room/**', '.github/workflows/coop-tests.yml']
  pull_request:
    paths: ['coop-test-room/**', '.github/workflows/coop-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: coop-test-room
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: coop-test-room/package-lock.json
      - run: npm install --package-lock-only
      - run: npm ci
      - run: npm test
